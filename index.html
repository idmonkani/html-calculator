<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Calculator" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="theme-color" content="#0a0a0b" />
  <title>Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }

    :root {
      --gold-hi: #f7e7b0;
      --gold: #d4b062;
      --gold-lo: #8c6b24;
      --edge-dark: #050506;
    }

    body {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #f2f2f2;
      overscroll-behavior: none;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(212, 176, 98, 0.10) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 100%, rgba(255, 255, 255, 0.04) 0%, transparent 60%),
        #0a0a0b;
    }

    /* ---------- Chassis ---------- */
    .calculator {
      position: relative;
      width: 100%;
      max-width: 370px;
      padding: 22px 22px 26px;
      border-radius: 34px;
      background: linear-gradient(160deg, #222327 0%, #131416 45%, #0d0e10 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.10),
        inset 0 -1px 0 rgba(0, 0, 0, 0.8),
        0 0 0 1px #000,
        0 2px 0 1px #1c1d20,
        0 40px 80px rgba(0, 0, 0, 0.75),
        0 10px 30px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }

    /* brushed-metal grain */
    .calculator::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: repeating-linear-gradient(90deg,
        rgba(255, 255, 255, 0.018) 0 1px,
        transparent 1px 3px);
      pointer-events: none;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 6px 14px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #6b6e75;
    }

    .brand .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, var(--gold-hi), var(--gold-lo));
      box-shadow: 0 0 10px rgba(212, 176, 98, 0.6);
    }

    /* ---------- Display ---------- */
    .display {
      position: relative;
      text-align: right;
      padding: 18px 18px 16px;
      margin-bottom: 22px;
      min-height: 124px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      border-radius: 20px;
      background: linear-gradient(180deg, #050506 0%, #0b0b0d 100%);
      box-shadow:
        inset 0 3px 10px rgba(0, 0, 0, 0.95),
        inset 0 0 0 1px rgba(0, 0, 0, 0.9),
        0 1px 0 rgba(255, 255, 255, 0.07);
      overflow: hidden;
    }

    .display::after {
      content: "";
      position: absolute;
      inset: 0 0 55% 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.045), transparent);
      pointer-events: none;
    }

    .expression {
      color: #7d828b;
      font-size: 16px;
      font-weight: 300;
      min-height: 22px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }

    .result {
      color: #f5f5f5;
      font-size: 54px;
      font-weight: 200;
      letter-spacing: -1.5px;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 18px rgba(255, 255, 255, 0.08);
    }

    /* ---------- Keys ---------- */
    .keys {
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .key {
      --face: linear-gradient(150deg, #3b3e44 0%, #25272b 42%, #2e3136 58%, #1a1b1e 100%);
      --edge: #0b0c0e;
      --ink: #eceef1;
      position: relative;
      height: 66px;
      border: none;
      border-radius: 18px;
      font-family: inherit;
      font-size: 22px;
      font-weight: 500;
      color: var(--ink);
      cursor: pointer;
      background: var(--face);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        inset 0 -2px 2px rgba(0, 0, 0, 0.45),
        0 6px 0 var(--edge),
        0 7px 0 rgba(255, 255, 255, 0.03),
        0 12px 18px rgba(0, 0, 0, 0.65);
      transform: translateY(0);
      transition: transform 0.07s ease, box-shadow 0.07s ease, filter 0.15s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      isolation: isolate;
    }

    /* brushed grain on every key */
    .key::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: repeating-linear-gradient(90deg,
        rgba(255, 255, 255, 0.035) 0 1px,
        transparent 1px 2px);
      mix-blend-mode: overlay;
      pointer-events: none;
      z-index: -1;
    }

    /* specular sheen */
    .key::after {
      content: "";
      position: absolute;
      left: 8%;
      right: 8%;
      top: 3px;
      height: 42%;
      border-radius: 14px 14px 40% 40%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0));
      pointer-events: none;
    }

    @media (hover: hover) {
      .key:hover { filter: brightness(1.08); }
    }

    .key:active,
    .key.pressed {
      transform: translateY(5px);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.14),
        inset 0 -1px 2px rgba(0, 0, 0, 0.5),
        0 1px 0 var(--edge),
        0 2px 4px rgba(0, 0, 0, 0.7);
    }

    .key:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

    /* titanium / silver function keys */
    .key.fn {
      --face: linear-gradient(150deg, #f1f2f4 0%, #b9bdc3 38%, #8e939a 55%, #d9dce0 80%, #a5a9b0 100%);
      --edge: #45484d;
      --ink: #17181b;
      font-weight: 600;
      font-size: 19px;
    }
    .key.fn::after { background: linear-gradient(180deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0)); }

    /* gunmetal operators with gold glyphs */
    .key.op {
      --face: linear-gradient(150deg, #2c2a26 0%, #1b1a17 45%, #26241f 60%, #121110 100%);
      --edge: #070706;
      --ink: var(--gold);
      font-size: 26px;
      font-weight: 500;
      box-shadow:
        inset 0 1px 0 rgba(247, 231, 176, 0.25),
        inset 0 0 0 1px rgba(212, 176, 98, 0.18),
        inset 0 -2px 2px rgba(0, 0, 0, 0.5),
        0 6px 0 var(--edge),
        0 12px 18px rgba(0, 0, 0, 0.65);
    }

    /* selected operator turns solid gold */
    .key.op.active,
    .key.equals {
      --face: linear-gradient(150deg, var(--gold-hi) 0%, #e2c47c 22%, var(--gold) 42%, var(--gold-lo) 62%, #e8cf87 85%, #a8842f 100%);
      --edge: #4d3a10;
      --ink: #2a1e04;
    }
    .key.op.active::after,
    .key.equals::after { background: linear-gradient(180deg, rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0)); }

    .key.equals {
      font-size: 28px;
      font-weight: 600;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.6),
        inset 0 -2px 3px rgba(77, 58, 16, 0.6),
        0 6px 0 var(--edge),
        0 12px 22px rgba(0, 0, 0, 0.65),
        0 0 28px rgba(212, 176, 98, 0.22);
    }

    .key.zero { grid-column: span 2; text-align: left; padding-left: 30px; }

    /* ---------- Phones: full-screen, thumb-friendly ---------- */
    @media (max-width: 520px) {
      body {
        padding: 0;
        align-items: stretch;
        background: #0a0a0b;
      }

      .calculator {
        max-width: none;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        border-radius: 0;
        padding:
          calc(env(safe-area-inset-top) + 14px)
          calc(env(safe-area-inset-right) + 16px)
          calc(env(safe-area-inset-bottom) + 20px)
          calc(env(safe-area-inset-left) + 16px);
        box-shadow: none;
      }

      .brand { padding: 4px 6px 12px; }

      .display {
        flex: 1;
        min-height: 140px;
        margin-bottom: 18px;
        padding: 20px 18px 16px;
      }

      .expression { font-size: 18px; }
      .result { font-size: 64px; }

      .keys { gap: clamp(10px, 3vw, 14px); }

      .key {
        height: auto;
        aspect-ratio: 1 / 0.92;
        font-size: clamp(22px, 6.5vw, 28px);
        border-radius: clamp(16px, 5vw, 22px);
      }
      .key.zero { aspect-ratio: auto; }
      .key.fn { font-size: clamp(18px, 5.5vw, 22px); }
      .key.op { font-size: clamp(26px, 7.5vw, 32px); }
      .key.equals { font-size: clamp(28px, 8vw, 34px); }
    }

    /* ---------- Short screens / phones in landscape ---------- */
    @media (max-height: 560px) and (min-width: 521px) {
      body { padding: 10px; }
      .calculator {
        max-width: 560px;
        padding:
          12px
          calc(env(safe-area-inset-right) + 18px)
          16px
          calc(env(safe-area-inset-left) + 18px);
        border-radius: 24px;
      }
      .brand { display: none; }
      .display { min-height: 76px; margin-bottom: 12px; padding: 10px 16px; border-radius: 14px; }
      .expression { font-size: 13px; min-height: 16px; }
      .result { font-size: 38px; }
      .keys { gap: 8px; }
      .key { height: 46px; font-size: 18px; border-radius: 12px; }
      .key.op { font-size: 22px; }
      .key.equals { font-size: 24px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .key { transition: none; }
    }
  </style>
</head>
<body>
  <main class="calculator">
    <div class="brand"><span>Calculator</span><span class="dot" aria-hidden="true"></span></div>

    <div class="display" aria-live="polite">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>

    <div class="keys">
      <button class="key fn" data-action="clear">AC</button>
      <button class="key fn" data-action="sign">±</button>
      <button class="key fn" data-action="percent">%</button>
      <button class="key op" data-op="/" aria-label="divide">÷</button>

      <button class="key" data-num="7">7</button>
      <button class="key" data-num="8">8</button>
      <button class="key" data-num="9">9</button>
      <button class="key op" data-op="*" aria-label="multiply">×</button>

      <button class="key" data-num="4">4</button>
      <button class="key" data-num="5">5</button>
      <button class="key" data-num="6">6</button>
      <button class="key op" data-op="-" aria-label="subtract">−</button>

      <button class="key" data-num="1">1</button>
      <button class="key" data-num="2">2</button>
      <button class="key" data-num="3">3</button>
      <button class="key op" data-op="+" aria-label="add">+</button>

      <button class="key zero" data-num="0">0</button>
      <button class="key" data-action="decimal">.</button>
      <button class="key equals" data-action="equals" aria-label="equals">=</button>
    </div>
  </main>

  <script>
    const resultEl = document.getElementById("result");
    const exprEl = document.getElementById("expression");
    const symbols = { "+": "+", "-": "−", "*": "×", "/": "÷" };

    let current = "0";      // number being typed
    let previous = null;    // stored left operand
    let operator = null;    // pending operator
    let resetNext = false;  // start a new number on next digit

    function format(value) {
      if (value === "Error") return value;
      const n = Number(value);
      if (!isFinite(n)) return "Error";
      if (value.endsWith(".")) return Number(value.slice(0, -1)).toLocaleString("en-US") + ".";
      const [int, dec] = value.split(".");
      const intFmt = Number(int).toLocaleString("en-US");
      return dec !== undefined ? `${intFmt}.${dec}` : intFmt;
    }

    // shrink the result until it fits the display, on any screen size
    function fitResult() {
      resultEl.style.fontSize = "";
      let size = parseFloat(getComputedStyle(resultEl).fontSize);
      while (resultEl.scrollWidth > resultEl.clientWidth && size > 22) {
        size -= 2;
        resultEl.style.fontSize = size + "px";
      }
    }

    function render() {
      const text = format(current);
      resultEl.textContent = text;
      fitResult();
      exprEl.textContent = operator ? `${format(previous)} ${symbols[operator]}` : exprEl.textContent;
      document.querySelectorAll(".op").forEach(b =>
        b.classList.toggle("active", b.dataset.op === operator && resetNext));
    }

    function compute(a, b, op) {
      a = parseFloat(a); b = parseFloat(b);
      let r;
      switch (op) {
        case "+": r = a + b; break;
        case "-": r = a - b; break;
        case "*": r = a * b; break;
        case "/": if (b === 0) return "Error"; r = a / b; break;
      }
      return String(parseFloat(r.toPrecision(12)));
    }

    function inputNumber(d) {
      if (current === "Error") clearAll();
      if (resetNext) { current = "0"; resetNext = false; }
      if (current.replace(/[-.]/g, "").length >= 15) return;
      current = current === "0" ? d : current === "-0" ? "-" + d : current + d;
    }

    function inputDecimal() {
      if (resetNext) { current = "0"; resetNext = false; }
      if (!current.includes(".")) current += ".";
    }

    function chooseOperator(op) {
      if (current === "Error") return;
      if (operator && !resetNext) {
        current = compute(previous, current, operator);
      }
      previous = current;
      operator = op;
      resetNext = true;
    }

    function equals() {
      if (!operator || current === "Error") return;
      const expr = `${format(previous)} ${symbols[operator]} ${format(current)} =`;
      current = compute(previous, current, operator);
      previous = null;
      operator = null;
      resetNext = true;
      exprEl.textContent = expr;
    }

    function clearAll() {
      current = "0"; previous = null; operator = null; resetNext = false;
      exprEl.textContent = "";
    }

    function backspace() {
      if (resetNext || current === "Error") return;
      current = current.length > 1 && current !== "-0" ? current.slice(0, -1) : "0";
      if (current === "-") current = "0";
    }

    function toggleSign() {
      if (current === "Error") return;
      current = current.startsWith("-") ? current.slice(1) : "-" + current;
    }

    function percent() {
      if (current === "Error") return;
      current = String(parseFloat((parseFloat(current) / 100).toPrecision(12)));
    }

    // press animation for keyboard input
    function flash(selector) {
      const btn = document.querySelector(selector);
      if (!btn) return;
      btn.classList.add("pressed");
      setTimeout(() => btn.classList.remove("pressed"), 110);
    }

    // instant press feedback on touch screens
    const keysEl = document.querySelector(".keys");
    keysEl.addEventListener("pointerdown", e => {
      const btn = e.target.closest("button");
      if (btn) btn.classList.add("pressed");
    });
    ["pointerup", "pointercancel"].forEach(type =>
      document.addEventListener(type, () =>
        keysEl.querySelectorAll(".pressed").forEach(b => b.classList.remove("pressed"))));

    // swipe left or right on the display to delete the last digit
    const displayEl = document.querySelector(".display");
    let swipeX = null;
    displayEl.addEventListener("touchstart", e => { swipeX = e.touches[0].clientX; }, { passive: true });
    displayEl.addEventListener("touchend", e => {
      if (swipeX !== null && Math.abs(e.changedTouches[0].clientX - swipeX) > 40) {
        backspace();
        render();
        if (navigator.vibrate) navigator.vibrate(8);
      }
      swipeX = null;
    });

    keysEl.addEventListener("click", e => {
      const btn = e.target.closest("button");
      if (!btn) return;
      if (navigator.vibrate) navigator.vibrate(8);
      const { num, op, action } = btn.dataset;
      if (num !== undefined) inputNumber(num);
      else if (op) chooseOperator(op);
      else if (action === "decimal") inputDecimal();
      else if (action === "equals") equals();
      else if (action === "clear") clearAll();
      else if (action === "sign") toggleSign();
      else if (action === "percent") percent();
      render();
    });

    document.addEventListener("keydown", e => {
      const k = e.key;
      if (/^[0-9]$/.test(k)) { inputNumber(k); flash(`[data-num="${k}"]`); }
      else if (["+", "-", "*", "/"].includes(k)) { chooseOperator(k); flash(`[data-op="${k}"]`); }
      else if (k === ".") { inputDecimal(); flash('[data-action="decimal"]'); }
      else if (k === "Enter" || k === "=") { e.preventDefault(); equals(); flash('[data-action="equals"]'); }
      else if (k === "Backspace") backspace();
      else if (k === "Escape") { clearAll(); flash('[data-action="clear"]'); }
      else if (k === "%") { percent(); flash('[data-action="percent"]'); }
      else return;
      render();
    });

    window.addEventListener("resize", fitResult);

    render();
  </script>
</body>
</html>
